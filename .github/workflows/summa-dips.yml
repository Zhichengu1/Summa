name: summa-dips

# Tech dip watch → Discord. Once per weekday after the US close: prices the
# curated Fortune-500 tech list + the tech names trending in recent
# `reddit_trends` snapshots via Yahoo's keyless chart endpoint, and posts one
# embed listing anything that closed down hard (≤ -4% on the day, or ≤ -10% over
# 5 sessions on a red day). 21:30 UTC is after the 16:00 ET close in both EDT
# (5:30pm) and EST (4:30pm). Holidays self-skip (no fresh bar → no alert).
# Alert-only (no Supabase writes), edgar-free — installs only
# requirements-news.txt. Cost: ~60 tiny HTTP GETs, ~1 free Actions minute/day.

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log the dips without posting to Discord"
        type: boolean
        default: false

concurrency:
  group: summa-dips
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Read-only job: don't leave the GITHUB_TOKEN in .git config.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-news.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-news.txt

      - name: Scan tech names for price dips
        working-directory: backend
        env:
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:             ${{ secrets.SUPABASE_KEY }}
          # Dedicated channel for dip alerts; falls back to the shared webhook
          # when the secret is unset.
          DISCORD_DIPS_WEBHOOK_URL: ${{ secrets.DISCORD_DIPS_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL:      ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m tools.dip_watch ${{ inputs.dry_run && '--dry-run' || '' }}
