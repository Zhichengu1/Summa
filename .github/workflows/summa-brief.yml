name: summa-brief

# Daily watchlist market brief → Discord. One run per weekday morning (12:45 UTC
# ≈ 8:45am EDT / 7:45am EST — pre-open, after the prior session's EOD bars and
# technicals have fully cycled through the pipeline's staged cadence). Reads the
# tiny precomputed company_summary table and posts a single embed (top movers,
# 52-week highs/lows, trend crosses, volume spikes, insider flow), so the cost
# is one paged Supabase read + one webhook post: ~5 free Actions minutes/week.
# Edgar-free — installs only requirements-news.txt, like summa-news.

on:
  schedule:
    - cron: "45 12 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: summa-brief
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-news.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-news.txt

      - name: Post daily watchlist brief
        working-directory: backend
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m tools.daily_brief
