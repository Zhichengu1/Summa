name: summa-recap

# Daily watchlist recap → Discord. One run per weekday evening (22:30 UTC
# ≈ 6:30pm EDT / 5:30pm EST — after the close, once the session's EOD bars have
# cycled through the pipeline's staged cadence into company_summary). Posts a
# single embed of plain-English prose: breadth, leaders and laggards, sector
# leadership, 52-week and moving-average milestones, unusual volume, filing
# activity, insider flow, and upcoming estimated earnings.
#
# The prose is assembled deterministically by backend/recap.py from stored
# numbers — no LLM, no external API. Cost is one paged Supabase read plus one
# webhook post: ~5 free Actions minutes/week. Edgar-free, so it installs only
# requirements-news.txt, like summa-brief and summa-news.
#
# Companion to summa-brief.yml: the morning brief is the forward-looking
# bullet board, this is the backward-looking narrative wrap of the session.

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and log the recap without posting to Discord"
        type: boolean
        default: false

concurrency:
  group: summa-recap
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-news.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-news.txt

      - name: Post daily watchlist recap
        working-directory: backend
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:               ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL:        ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional dedicated channel for the recap; falls back to the line above.
          DISCORD_RECAP_WEBHOOK_URL:  ${{ secrets.DISCORD_RECAP_WEBHOOK_URL }}
        run: python -m tools.daily_recap ${{ inputs.dry_run && '--dry-run' || '' }}
