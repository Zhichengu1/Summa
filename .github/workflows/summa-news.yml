name: summa-news

# High-frequency, lightweight NEWS-only refresh — keeps the Discord alerts + the
# Realtime "Top Intelligence" feed as close to real-time as a free cron allows.
# Runs `python -m tools.refresh_news`, a lightweight entry point that polls the
# curated market-wide RSS feeds (Fed/BEA/SEC/FDA/FTC/CFTC/White House/PRN), scores
# for importance, writes just the new market-movers, and alerts them. It imports
# NO edgartools/pandas, so it installs only requirements-news.txt (supabase +
# requests + dotenv) and each run finishes in seconds — safe at every 5 minutes
# (GitHub's practical cron floor; scheduled runs may still be delayed under load).
# The main summa-pipeline (*/10) also refreshes market news as a backstop — dedup
# makes the overlap harmless.
#
# Per-company Google News stays on the main pipeline's hourly cadence (Google
# politeness). To include it here too, add the `--company` flag (heavier).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: summa-news
  cancel-in-progress: false   # never interrupt an in-flight write to Supabase

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4        # < the 5-min interval so a run never overlaps the next tick
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-news.txt

      # Minimal deps only (supabase + requests + dotenv) — this job never touches
      # edgartools/pandas, so installs are tiny and each run finishes in seconds.
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-news.txt

      - name: Refresh market news
        working-directory: backend
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m tools.refresh_news
