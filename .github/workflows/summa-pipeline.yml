name: summa-pipeline

# Runs the SEC filing intelligence pipeline every 10 minutes.
# main.py uses a staged cadence: each run ingests newly-queued companies plus a
# bounded batch of the stalest ones (INGEST_MAX_PER_RUN), so runtime and EDGAR/
# Supabase load stay flat as the watchlist grows. Discord alerts run only on
# just-filed documents. Credentials come from secrets.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

concurrency:
  group: summa-pipeline
  cancel-in-progress: false   # never interrupt an in-flight write to Supabase

permissions:
  contents: read

# actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 + setup-python@v5 ship a Node 20 runtime, which GitHub is
# deprecating (forced to Node 24 on 2026-06-02; Node 20 removed 2026-09-16). Opt
# in early so the runner uses Node 24 now and the deprecation warning stops; both
# actions support it.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9        # hard cap < the 10-min cron interval so a run never overlaps the next tick
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pipeline
        working-directory: backend
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          EDGAR_IDENTITY:      ${{ secrets.EDGAR_IDENTITY }}
          # SEC fair-access throttle. edgartools reads this at import time and
          # defaults to 9 (SEC's ~10 req/s ceiling); set explicitly so the limit
          # is documented and survives a future change to the library default.
          EDGAR_RATE_LIMIT_PER_SEC: "9"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Match summa-news.yml: alert company headlines at the UI's "important"
          # floor (3), not just Notable+ catalysts (code default 6).
          NEWS_ALERT_SCORE: "3"
          # Per-run budget. Public repo ⇒ Actions minutes are free/unlimited, so the
          # cap is sized for coverage latency (how fast a full watchlist sweep finishes),
          # not billing. Real ceiling is EDGAR's 9 req/s + the wall-clock budget below.
          # Per-dataset cadence (INTERVAL_FUNDAMENTALS, ...) uses code defaults.
          INGEST_MAX_PER_RUN: "25"
          # Wall-clock budget: stop *starting* new companies after 7 min so the run
          # finishes (final state write) before the 9-min timeout and well inside the
          # 10-min cron interval. The ~2-min margin covers cached pip install + writes.
          INGEST_TIME_BUDGET_S: "420"
        run: python main.py
