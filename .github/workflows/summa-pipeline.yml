name: summa-pipeline

# Runs the SEC filing intelligence pipeline every 10 minutes.
# Stage 1 signal extraction is free; Stage 2 (Gemini) + Discord run only on
# flagged filings. All credentials come from repository secrets.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

concurrency:
  group: summa-pipeline
  cancel-in-progress: false   # never interrupt an in-flight write to Supabase

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8        # hard cap so runs never overlap the next cron tick
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pipeline
        working-directory: backend
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          EDGAR_IDENTITY:      ${{ secrets.EDGAR_IDENTITY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
