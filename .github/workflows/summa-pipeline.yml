name: summa-pipeline

# Runs the SEC filing intelligence pipeline every 10 minutes.
# main.py uses a staged cadence: each run ingests newly-queued companies plus a
# bounded batch of the stalest ones (INGEST_MAX_PER_RUN), so runtime and EDGAR/
# Supabase load stay flat as the watchlist grows. Stage 1 is free; Stage 2
# (Gemini) + Discord run only on flagged filings. Credentials come from secrets.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

concurrency:
  group: summa-pipeline
  cancel-in-progress: false   # never interrupt an in-flight write to Supabase

permissions:
  contents: read

# actions/checkout@v4 + setup-python@v5 ship a Node 20 runtime, which GitHub is
# deprecating (forced to Node 24 on 2026-06-02; Node 20 removed 2026-09-16). Opt
# in early so the runner uses Node 24 now and the deprecation warning stops; both
# actions support it.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8        # hard cap so runs never overlap the next cron tick
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pipeline
        working-directory: backend
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          EDGAR_IDENTITY:      ${{ secrets.EDGAR_IDENTITY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Per-run budget — keeps each tick within the 8-min cap. Tune freely.
          # Per-dataset cadence (INTERVAL_FUNDAMENTALS, ...) uses code defaults.
          INGEST_MAX_PER_RUN: "12"
          # Wall-clock budget: stop starting new companies after 6 min so the run
          # exits cleanly and commits state instead of being killed at the 8-min
          # timeout-minutes cap. The ~2-min margin covers pip install + final writes.
          INGEST_TIME_BUDGET_S: "360"
        run: python main.py
