name: summa-congress

# Congressional stock-trade disclosures → `congress_trades`. Pulls the free
# keyless static JSON behind Kadoa's open-source Congress Trading Monitor
# (normalized House PTR + Senate eFD + executive-branch STOCK-Act filings,
# refreshed daily) and upserts every tickered transaction, keyed on the
# source's stable id — re-runs are idempotent. Powers the frontend "Congress"
# view (consensus buys/sells: stocks 3+ members bought or sold in a window)
# and posts a Discord digest of the genuinely-new disclosures + the current
# consensus — quiet when nothing is new, suppressed on the first-ever seed.
# The feed updates ~daily, so two runs bracket the US day: 11:25 UTC (pre-open
# ET) + 22:25 UTC (after the close). Cost: one ~4 MB HTTP GET + a few Supabase
# upsert chunks per run. Edgar-free — installs only requirements-news.txt.

on:
  schedule:
    - cron: "25 11,22 * * *"
  workflow_dispatch:
    inputs:
      force_digest:
        description: "Post the latest digest even if there are no new disclosures"
        type: boolean
        default: false

concurrency:
  group: summa-congress
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Read-only job: don't leave the GITHUB_TOKEN in .git config.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-news.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-news.txt

      - name: Ingest congressional trades
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Dedicated channel for the congress digest; falls back to the shared
          # webhook when the secret is unset.
          DISCORD_CONGRESS_WEBHOOK_URL: ${{ secrets.DISCORD_CONGRESS_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL:          ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Manual runs can force the digest even with no new delta (empty/false
          # on scheduled runs → normal quiet-when-nothing-new gate).
          CONGRESS_FORCE_DIGEST: ${{ inputs.force_digest && '1' || '0' }}
        run: python -m tools.congress_trades
