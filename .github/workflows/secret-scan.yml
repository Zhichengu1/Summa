name: secret-scan

# Defense-in-depth against accidentally committing credentials now that the
# repo is public. Runs gitleaks on every push and PR; also scans full history
# on manual dispatch. Fails the job if any secret-like pattern is found.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# Opt the Node 20 actions onto the Node 24 runtime (forced 2026-06-02;
# Node 20 removed 2026-09-16) — consistent with the other workflows.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0          # full history so a rewrite/old commit is scanned too

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
