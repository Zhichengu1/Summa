name: keepalive

# GitHub automatically disables scheduled workflows after 60 days of repo
# inactivity (no pushes). This workflow runs monthly and re-enables the
# pipeline workflow via the GitHub API so the schedule never silently stops.
#
# Uses actions/github-script (first-party GitHub action) instead of a
# third-party action to avoid supply-chain risk from unpinned external deps.

on:
  schedule:
    - cron: '0 12 1 * *'    # noon UTC, 1st of every month
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Re-enable scheduled workflows
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = ['summa-pipeline.yml', 'summa-cleanup.yml'];
            for (const wf of workflows) {
              try {
                await github.rest.actions.enableWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: wf,
                });
                core.info(`Re-enabled: ${wf}`);
              } catch (e) {
                core.info(`${wf} already active or not found: ${e.message}`);
              }
            }
