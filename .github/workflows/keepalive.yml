name: keepalive

# GitHub automatically disables scheduled workflows after 60 days of repo
# inactivity (no pushes). This workflow runs on the 1st of every month and
# re-enables all workflows via the GitHub API so the pipeline never silently stops.

on:
  schedule:
    - cron: '0 12 1 * *'    # noon UTC, first day of every month
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true        # re-enables via API, no commit noise
