name: keepalive

# GitHub suspends scheduled workflows after 60 days without repository activity.
# This writes a heartbeat timestamp weekly so the pipeline cron is never paused.

on:
  schedule:
    - cron: "0 6 * * 1"     # 06:00 UTC every Monday
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update heartbeat
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive.txt

      - name: Commit heartbeat
        run: |
          git config user.name  "summa-keepalive[bot]"
          git config user.email "summa-keepalive@users.noreply.github.com"
          git add .github/last-keepalive.txt
          git diff --staged --quiet || git commit -m "chore: keepalive heartbeat [skip ci]"
          git push
