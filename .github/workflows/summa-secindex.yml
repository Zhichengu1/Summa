name: summa-secindex

# Refreshes the bundled SEC company index (frontend/public/sec-companies.json)
# that powers the frontend's universal company search. The SEC list changes
# slowly, so weekly is plenty. Commits only when the file actually changes, and
# the commit doubles as repository activity that keeps the cron schedules alive.

on:
  schedule:
    - cron: "0 7 * * 1"     # 07:00 UTC every Monday
  workflow_dispatch: {}

concurrency:
  group: summa-secindex
  cancel-in-progress: false

permissions:
  contents: write

# Opt the Node 20 actions onto the Node 24 runtime early (forced 2026-06-02;
# Node 20 removed 2026-09-16) so the deprecation warning stops.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Rebuild SEC company index
        working-directory: backend
        env:
          # SEC fair-access requires a descriptive User-Agent on the request.
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
        run: python -m tools.build_sec_index   # stdlib only, no pip install needed

      - name: Commit if changed
        run: |
          git config user.name  "summa-secindex[bot]"
          git config user.email "summa-secindex@users.noreply.github.com"
          git add frontend/public/sec-companies.json
          git diff --staged --quiet || git commit -m "chore: refresh SEC company index [skip ci]"
          git push
