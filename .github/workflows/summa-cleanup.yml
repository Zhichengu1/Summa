name: summa-cleanup

# Monthly maintenance: generate per-company reports + cross-company digest,
# then delete filings/filing_events older than 30 days. company_meta is never
# touched — it holds the rolling baselines the signal algorithm needs.

on:
  schedule:
    - cron: "0 3 1 * *"     # 03:00 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: read

# Opt the Node 20 actions onto the Node 24 runtime early (forced 2026-06-02;
# Node 20 removed 2026-09-16) so the deprecation warning stops.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Generate reports + purge old rows
        working-directory: backend
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          EDGAR_IDENTITY:      ${{ secrets.EDGAR_IDENTITY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python cleanup.py
