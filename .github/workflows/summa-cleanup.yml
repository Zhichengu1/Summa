name: summa-cleanup

# Runs on the 1st of every month at 03:00 UTC.
# Deletes filings and filing_events older than 30 days from Supabase.
# company_meta is intentionally preserved (rolling baselines, not time-series).

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:             # manual trigger from Actions UI

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache virtual environment
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: scraper/.venv
          key: ${{ runner.os }}-venv-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install dependencies (cache miss only)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv scraper/.venv
          scraper/.venv/bin/pip install --upgrade pip
          scraper/.venv/bin/pip install -r scraper/requirements.txt

      - name: Run cleanup
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: .venv/bin/python cleanup.py
