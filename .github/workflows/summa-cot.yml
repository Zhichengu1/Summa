name: summa-cot

# CFTC Commitments of Traders → `cot_reports`. Pulls the free keyless CFTC
# Public Reporting API (legacy futures-only report) for a curated set of ~28
# major futures markets and upserts one row per market per weekly report,
# keyed on (market_code, report_date) — re-runs are idempotent, and the first
# run backfills ~3y of history so the positioning index works immediately.
# Powers the frontend "COT Futures" view (spec-net positioning index: crowded
# longs/shorts, flips, weekly shifts) and posts a weekly Discord digest —
# quiet when no new report week landed, suppressed on the first-ever seed.
# The CFTC publishes Friday ~3:30pm ET (19:30/20:30 UTC), so the main run is
# Friday 21:05 UTC; the Monday run catches holiday-delayed releases (both are
# cheap no-ops when nothing is new). Cost: one small HTTP GET + a few Supabase
# upsert chunks per run. Edgar-free — installs only requirements-news.txt.

on:
  schedule:
    - cron: "5 21 * * 5"
    - cron: "5 22 * * 1"
  workflow_dispatch:
    inputs:
      force_digest:
        description: "Post the latest digest even if no new report week landed"
        type: boolean
        default: false

concurrency:
  group: summa-cot
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Read-only job: don't leave the GITHUB_TOKEN in .git config.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-news.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-news.txt

      - name: Ingest CFTC COT report
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Dedicated channel for the COT digest; falls back to the shared
          # webhook when the secret is unset.
          DISCORD_COT_WEBHOOK_URL: ${{ secrets.DISCORD_COT_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL:     ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Manual runs can force the digest even with no new report week
          # (empty/false on scheduled runs → normal quiet-when-nothing-new gate).
          COT_FORCE_DIGEST: ${{ inputs.force_digest && '1' || '0' }}
        run: python -m tools.cot
