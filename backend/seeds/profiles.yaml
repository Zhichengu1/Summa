# Curated industry profiles + forward-looking themes — the quality floor.
# Keyed by ticker. Ported from frontend/lib/taxonomy.ts. The reference ingest
# merges SIC-derived sector/industry over this, but keeps the curated `industry`
# and `thesis` (SIC is too coarse), and writes these themes verbatim.
#
# Source of truth for curated context; grow this file rather than the frontend.

AAPL:
  sector: Technology
  industry: Consumer Electronics & Devices
  thesis: >-
    Apple monetizes the world's most profitable installed base of ~2.2B active
    devices. Hardware (iPhone is ~half of revenue) drives the install base; the
    strategic shift is toward high-margin recurring services and deeper vertical
    integration of its own silicon.
  themes:
    - name: Services
      note: "App Store, iCloud, Apple Music, TV+, AppleCare and Pay — recurring revenue running over $90B/yr at ~70% gross margin, smoothing out hardware cycles."
    - name: Apple Silicon
      note: "In-house M-series and A-series chips that replaced Intel, giving Apple end-to-end control of performance, battery life, margin, and its product roadmap."
    - name: Vision Pro / Spatial Computing
      note: "A $3,500 mixed-reality headset and the visionOS platform — an early, expensive bet on the computing interface that comes after the smartphone."
    - name: Apple Intelligence
      note: "Generative AI run privately on-device rather than in the cloud — a privacy-led approach meant to differentiate from Google and OpenAI."
    - name: Health
      note: "ECG, blood-oxygen and sensor features on Apple Watch positioning the device as a regulated, sticky personal-health platform."

MSFT:
  sector: Technology
  industry: Software — Infrastructure & Cloud
  thesis: >-
    Microsoft runs three large engines: enterprise productivity (Office/Microsoft
    365), the Azure cloud, and a growing consumer/gaming arm. The current bet is
    to monetize AI across every layer of that stack before rivals do.
  themes:
    - name: Azure
      note: "The #2 hyperscale cloud platform behind AWS and Microsoft's primary growth engine, compounding ~30% a year; the home for its AI compute."
    - name: Copilot / OpenAI
      note: "A ~$13B investment in OpenAI plus 'Copilot' AI assistants embedded into Office, Windows, and GitHub — Microsoft's attempt to charge a premium for AI."
    - name: Activision Blizzard
      note: "The $69B 2023 acquisition (Call of Duty, World of Warcraft, Candy Crush) that anchors the Xbox Game Pass subscription strategy."
    - name: Security
      note: "A $20B+/yr business (Defender, Entra, Sentinel) bundled into enterprise licenses to displace standalone vendors like CrowdStrike and Palo Alto."

AMZN:
  sector: Consumer Discretionary
  industry: E-commerce & Cloud Computing
  thesis: >-
    A low-margin retail empire funded by two high-margin engines — AWS cloud and
    advertising — which together generate most of the operating profit and
    bankroll Amazon's bets on AI, logistics, and space.
  themes:
    - name: AWS
      note: "The world's largest cloud platform; though ~one-sixth of revenue it produces the majority of Amazon's operating income, funding the rest of the company."
    - name: Bedrock & Trainium
      note: "Bedrock is AWS's marketplace for hosting third-party AI models; Trainium and Inferentia are Amazon's own AI chips, built to cut its dependence on Nvidia."
    - name: Advertising
      note: "A ~$50B/yr ad business built on retail search results — one of the fastest-growing and highest-margin parts of the company."
    - name: Project Kuiper
      note: "A planned 3,200-satellite low-Earth-orbit internet network meant to rival SpaceX's Starlink and extend AWS connectivity."
    - name: Logistics Automation
      note: "Warehouse robotics and a regionalized fulfillment network re-engineered to lower cost-to-serve and speed up delivery."

GOOGL:
  sector: Communication Services
  industry: Internet — Search & Advertising
  thesis: >-
    Alphabet still earns the majority of its money from Google Search advertising.
    The central tension is defending that cash machine against AI-driven disruption
    while scaling cloud and placing long-dated bets on autonomy and quantum.
  themes:
    - name: Search & Ads
      note: "Google Search plus the ad network remain the core profit engine — the business now being defended against AI chatbots that could disintermediate search."
    - name: Google Cloud
      note: "The #3 hyperscaler behind AWS and Azure; recently turned profitable and is Alphabet's main diversification away from advertising."
    - name: Gemini
      note: "Google's flagship multimodal AI model family, now woven into Search ('AI Overviews'), Workspace, and Android as its answer to OpenAI."
    - name: Waymo
      note: "The most advanced US robotaxi operator, running paid fully-driverless rides in several cities — Alphabet's biggest 'Other Bet'."
    - name: YouTube
      note: "The largest online video platform; its ads and subscriptions (Premium, YouTube TV) rival Netflix in revenue."
    - name: Quantum
      note: "Long-horizon quantum-computing research (the 'Willow' chip) aimed at problems no classical computer can solve."

META:
  sector: Communication Services
  industry: Internet — Social Media & Advertising
  thesis: >-
    Meta earns almost all of its revenue from advertising across Instagram,
    Facebook, and WhatsApp. It funnels that cash into two enormous bets — AI
    infrastructure and the metaverse — that are reshaping its cost base.
  themes:
    - name: Advertising
      note: "Instagram and Facebook ads are ~98% of revenue — the engine that funds every other bet and the segment most exposed to AI-driven targeting gains."
    - name: Reality Labs
      note: "The AR/VR division (Quest headsets, AR glasses) losing over $15B/yr — a long-term wager that the metaverse becomes the next computing platform."
    - name: Llama
      note: "Meta's family of freely released open-source LLMs — a deliberate strategy to commoditize AI models and stop rivals from owning the platform layer."
    - name: AI Infrastructure
      note: "Hundreds of thousands of GPUs plus custom MTIA silicon to train frontier models and power ad ranking and recommendations."
    - name: Smart Glasses
      note: "Ray-Ban Meta glasses — an AI-assistant wearable Meta views as the bridge to mainstream augmented reality."

TSLA:
  sector: Consumer Discretionary
  industry: Automobiles & Clean Energy
  thesis: >-
    Today Tesla is an automaker whose vehicle margins fund a far larger ambition:
    to become an AI, robotics, and energy company. The bull case rests almost
    entirely on autonomy and robotics rather than car sales.
  themes:
    - name: Electric Vehicles
      note: "The core business; vehicle volume and pricing set the cash flow that funds every other initiative."
    - name: FSD / Robotaxi
      note: "'Full Self-Driving' is Tesla's camera-based autonomy software; the planned 'Cybercab' robotaxi is the centerpiece of the company's valuation thesis."
    - name: Energy Storage
      note: "Megapack (grid-scale) and Powerwall (home) batteries — the fastest-growing and increasingly profitable segment."
    - name: Optimus
      note: "A general-purpose humanoid robot Tesla intends to deploy in its own factories first, then sell — a bet on a labor-replacement market."
    - name: Dojo
      note: "Tesla's in-house supercomputer purpose-built to train self-driving neural nets on enormous volumes of vehicle video."

NVDA:
  sector: Technology
  industry: Semiconductors
  thesis: >-
    Nvidia designs the GPUs that train and run nearly every large AI model, making
    it the pick-and-shovel supplier of the AI boom. Its durability rests less on
    chips than on the CUDA software ecosystem that locks customers in.
  themes:
    - name: Accelerated Computing
      note: "GPUs that perform the parallel math behind modern AI — the foundation of essentially every large model in production today."
    - name: Data-Center GPUs
      note: "H100/H200 and Blackwell-class chips sold to cloud providers and AI labs; the data-center segment is now the overwhelming majority of revenue."
    - name: Networking
      note: "Mellanox-derived InfiniBand and Spectrum interconnects that link tens of thousands of GPUs into a single training cluster — increasingly where the value sits."
    - name: CUDA
      note: "The proprietary software layer developers must use to program Nvidia chips; the switching cost it creates is the company's deepest competitive moat."
    - name: Robotics / Autonomous
      note: "The Drive (vehicles) and Jetson/Isaac (robots) platforms extending Nvidia's compute from data centers into the physical world."

BLK:
  sector: Financials
  industry: Asset & Investment Management
  thesis: >-
    BlackRock is the world's largest asset manager (~$11T+ in assets under
    management), earning fees on money it invests for others rather than betting
    its own balance sheet. Because most of that is low-fee index and ETF money,
    the strategic push is toward higher-fee private markets and toward selling
    its risk-management software as a recurring-revenue technology business.
  themes:
    - name: iShares / ETFs
      note: "The world's largest ETF franchise and BlackRock's core growth engine — trillions in low-cost index funds whose scale makes the firm a top-three holder of nearly every US large-cap."
    - name: Aladdin
      note: "BlackRock's risk-management and portfolio-operations software, licensed to other banks, insurers and managers — a sticky, high-margin recurring technology revenue stream that turns the firm into a financial-infrastructure provider, not just a fund manager."
    - name: Private Markets
      note: "The 2024 acquisitions of Global Infrastructure Partners (~$12.5B) and HPS, plus the Preqin data deal — a deliberate pivot into higher-fee private credit, infrastructure and alternatives to offset fee compression in index funds."
    - name: Digital Assets
      note: "IBIT, BlackRock's spot bitcoin ETF, became one of the fastest-growing ETFs in history; paired with tokenization pilots, it marks the firm's move to bring crypto and on-chain assets into mainstream portfolios."
    - name: Retirement / LifePath
      note: "Target-date and retirement funds (LifePath) that capture long-horizon 401(k) and pension flows — a durable, sticky source of assets that compounds as savers contribute over decades."
